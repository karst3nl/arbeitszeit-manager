{{template "header" .}}
<article class="card login-card">
  <hgroup>
    <h1>Anmelden</h1>
    <p class="muted">Arbeitszeit-Manager · nur im lokalen Netzwerk erreichbar</p>
  </hgroup>
  <form method="post" action="/login">
    {{template "csrf" .}}
    <label for="username">Benutzername</label>
    <input id="username" name="username" required autofocus autocomplete="username" maxlength="80">
    <label for="password">Passwort</label>
    <input id="password" type="password" name="password" required autocomplete="current-password">
    <div class="actions">
      <button type="submit">Anmelden</button>
    </div>
  </form>
</article>
{{template "footer" .}}
