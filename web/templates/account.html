{{template "header" .}}

<div class="page-columns even">
  <article class="card">
    <h2>Anzeigename</h2>
    <form method="post" action="/account/display-name">
      {{template "csrf" .}}
      <label>Name
        <input name="display_name" value="{{.User.DisplayName}}" maxlength="120" required>
      </label>
      <div class="actions">
        <button type="submit" class="secondary">Speichern</button>
      </div>
    </form>
  </article>

  <article class="card">
    <h2>Passwort ändern</h2>
    <p class="muted">Nach der Änderung werden alle anderen Geräte abgemeldet.</p>
    <form method="post" action="/account/password">
      {{template "csrf" .}}
      <label>Aktuelles Passwort
        <input type="password" name="old_password" required autocomplete="current-password">
      </label>
      <label>Neues Passwort (mind. 8 Zeichen)
        <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
      </label>
      <label>Neues Passwort wiederholen
        <input type="password" name="repeat_password" required minlength="8" autocomplete="new-password">
      </label>
      <div class="actions">
        <button type="submit">Passwort ändern</button>
      </div>
    </form>
  </article>
</div>

<p class="muted">Angemeldet als <strong>{{.User.Username}}</strong> · Rolle: {{if .User.IsAdmin}}Admin{{else}}Nutzer{{end}}</p>
{{template "footer" .}}
